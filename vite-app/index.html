<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- The colour the OS paints the window chrome: the title bar on an installed
     desktop app, the status bar on Android. It was the light background, so an
     installed app got a white bar above it whichever theme was running. This is
     the icon's background, so the two meet without a seam. -->
<meta name="theme-color" content="#1b1e1f" />
<!-- iOS ignores the web manifest when a page is added to the home screen, so
     the standalone hint and the icon have to be declared the old way too. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- black-translucent lets the page run under the status bar; the app already
     handles the inset via viewport-fit=cover and env(safe-area-inset-*). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Field Ops" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
<title>VagaboNDE Field Ops</title>
<!-- Stamp the saved theme (and motion preference) before the first paint.
     React reads the same value into state, but its useEffect runs after the
     browser has already painted a frame — so a saved-dark user flashed the
     light theme on every cold start. This runs before any paint. Keys match
     Store in data.js ("nde." + key, JSON-encoded). -->
<script>
  try {
    var t = JSON.parse(localStorage.getItem("nde.theme"));
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    var m = JSON.parse(localStorage.getItem("nde.motion"));
    if (m === "off") document.documentElement.setAttribute("data-motion", "off");
  } catch (e) {}
</script>
<link rel="stylesheet" href="/_ds/industry-4eca1223-ce17-4bd0-9b75-9c7070304b91/styles.css">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
